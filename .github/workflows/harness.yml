name: Verification Harness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      # config.py의 settings = Settings()가 import 시점에 REDIS_URL을 요구한다.
      # 미제공 시 alembic(모델 import)과 backend pytest가 동시에 붕괴한다.
      REDIS_URL: redis://localhost:6379/0
      # 아래 두 값은 CI 테스트 전용 throwaway이며 실제 자격증명이 아니다.
      # credentials.py(Fernet 암복호 왕복 테스트)와 security.py(JWT)가 요구한다.
      KIS_CREDENTIAL_MASTER_KEY: XxCUKEeJ32QDI0VCBbD1-JmcJ03cJ9zUuBGpiP2DiGs=
      JWT_SECRET_KEY: ci-test-only-jwt-secret-not-for-production-use

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run verification harness
        run: python scripts/verify_harness.py
